<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Восстановление пароля аккаунта Skyline через Supabase.">
  <title>Skyline | Восстановление пароля</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="shortcut icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">

  <!-- Launcher Font & Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .reset-card-box {
      max-width: 460px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-md);
      padding: 36px 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    }
    .reset-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid var(--accent-color-mixed);
      color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 16px;
    }
    .reset-form {
      display: none;
      flex-direction: column;
      gap: 14px;
    }
    .reset-form.active {
      display: flex;
    }
  </style>
</head>
<body>
  <!-- Ambient Plasma Glowing Orbs -->
  <div class="ambient-glow-layer" aria-hidden="true">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <!-- Navigation Header -->
  <header class="site-header" id="mainHeader">
    <div class="header-inner">
      <div class="header-brand" onclick="location.href='index.html'" style="cursor:pointer;">
        <img class="header-logo-img" src="assets/logo.png" alt="Skyline Logo">
        <div class="header-brand-title">
          <span>SKYLINE</span>
          <span class="header-badge">Password Reset</span>
        </div>
      </div>

      <nav class="header-nav">
        <button type="button" onclick="location.href='index.html'" data-i18n="nav_home">Главная</button>
        <button type="button" onclick="location.href='profile.html'" data-i18n="nav_profile_long">Личный кабинет</button>
      </nav>

      <div class="header-actions">
        <!-- Language Switcher -->
        <div class="lang-switcher" role="group" aria-label="Language Selector">
          <button type="button" class="lang-btn active" data-lang="ru">RU</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>

        <button type="button" class="btn-outline" onclick="location.href='profile.html'">
          <i class="bi bi-box-arrow-in-right"></i>
          <span data-i18n="nav_login">Вход</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="profile-page-wrapper">
    <button type="button" class="page-back-btn" onclick="location.href='profile.html'">
      <i class="bi bi-arrow-left"></i>
      <span data-i18n="reset_back_login">Вернуться ко входу</span>
    </button>

    <div class="reset-card-box">
      <!-- Top Header -->
      <div style="margin-bottom:20px;">
        <div class="reset-icon-wrap">
          <i class="bi bi-key-fill"></i>
        </div>
        <span class="section-tag" data-i18n="reset_tag">Безопасность</span>
        <h1 id="resetTitle" style="font-size:22px; font-family:var(--font-bold); margin-top:4px;" data-i18n="reset_req_title">Восстановление <span>пароля</span></h1>
        <p id="resetSubtitle" style="color:var(--text-color-grayed); font-size:13px; margin-top:4px;" data-i18n="reset_req_subtitle">
          Введите Email от вашего аккаунта, и мы отправим ссылку для сброса пароля
        </p>
      </div>

      <!-- Notification / Alert Box -->
      <div id="resetAlert" class="alert-box error" style="display:none;"></div>

      <!-- FORM 1: Request Reset Link (by Email) -->
      <form id="formRequestReset" class="reset-form active" novalidate>
        <div class="form-group">
          <label for="requestEmail" data-i18n="reset_email_label">Ваш Email</label>
          <div class="input-container">
            <input type="email" id="requestEmail" placeholder="name@example.com" required autocomplete="email">
            <i class="bi bi-envelope input-icon"></i>
          </div>
        </div>

        <button type="submit" class="btn-fill" id="btnSubmitRequest" style="height:46px;">
          <i class="bi bi-send-fill"></i>
          <span data-i18n="reset_btn_send">Отправить ссылку для сброса</span>
        </button>

        <div style="text-align:center; font-size:12.5px; color:var(--text-color-grayed); margin-top:12px;">
          <span data-i18n="reset_remember_pass">Вспомнили пароль?</span> 
          <button type="button" onclick="location.href='profile.html'" style="background:none; border:none; color:var(--accent-color); font-weight:700; padding:0; cursor:pointer;" data-i18n="reset_link_login">Войти в аккаунт</button>
        </div>
      </form>

      <!-- FORM 2: Set New Password (Triggered when user opens recovery link) -->
      <form id="formUpdatePassword" class="reset-form" novalidate>
        <div class="form-group">
          <label for="newPassword" data-i18n="reset_new_pass_label">Новый пароль</label>
          <div class="input-container">
            <input type="password" id="newPassword" placeholder="Минимум 6 символов" required autocomplete="new-password">
            <i class="bi bi-lock input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmNewPassword" data-i18n="reset_confirm_pass_label">Повторите новый пароль</label>
          <div class="input-container">
            <input type="password" id="confirmNewPassword" placeholder="••••••••" required autocomplete="new-password">
            <i class="bi bi-shield-check input-icon"></i>
          </div>
        </div>

        <button type="submit" class="btn-fill" id="btnSubmitUpdate" style="height:46px;">
          <i class="bi bi-check2-circle"></i>
          <span data-i18n="reset_btn_save">Сохранить новый пароль</span>
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand" onclick="location.href='index.html'" style="cursor:pointer;">
        <img src="assets/logo.png" alt="Skyline" style="width:20px; height:20px; border-radius:6px;">
        <span style="font-family:var(--font-bold); font-size:13px;">SKYLINE CLIENT</span>
      </div>
      <div class="footer-links">
        <a href="index.html" data-i18n="footer_home">Главная</a>
        <a href="profile.html" data-i18n="nav_profile_long">Личный кабинет</a>
        <a href="terms.html" data-i18n="footer_terms">Пользовательское соглашение</a>
        <a href="privacy.html" data-i18n="footer_privacy">Политика конфиденциальности</a>
      </div>
      <div class="footer-copy" data-i18n="footer_copy">
        &copy; 2026 Skyline. Все права защищены.
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    (function() {
      const SUPABASE_URL = "https://cvincrtbliwmjlxloczi.supabase.co";
      const SUPABASE_KEY = "sb_publishable_HZuArEdxGLbmsv7t2tUQng_GYW5vSLz";
      
      let sb = null;
      if (typeof window.supabase !== "undefined") {
        try {
          sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
          console.error("Supabase init error:", e);
        }
      }

      const formRequest = document.getElementById('formRequestReset');
      const formUpdate = document.getElementById('formUpdatePassword');
      const resetTitle = document.getElementById('resetTitle');
      const resetSubtitle = document.getElementById('resetSubtitle');
      const resetAlert = document.getElementById('resetAlert');
      const btnSubmitRequest = document.getElementById('btnSubmitRequest');
      const btnSubmitUpdate = document.getElementById('btnSubmitUpdate');

      function showAlert(msg, type = 'error') {
        if (!resetAlert) return;
        const iconClass = type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill';
        const cleanMsg = msg.replace(/^[✓✕⚠❌✅]\s*/, '');
        resetAlert.innerHTML = `<i class="bi ${iconClass}"></i> <span>${cleanMsg}</span>`;
        resetAlert.className = 'alert-box ' + type;
        resetAlert.style.display = 'flex';
      }

      function clearAlert() {
        if (!resetAlert) return;
        resetAlert.style.display = 'none';
        resetAlert.textContent = '';
      }

      function switchToUpdateMode() {
        if (formRequest) formRequest.classList.remove('active');
        if (formUpdate) formUpdate.classList.add('active');
        
        const curLang = localStorage.getItem('skyline_lang') || localStorage.getItem('shape_lang') || 'ru';
        if (curLang === 'en') {
          if (resetTitle) resetTitle.innerHTML = 'New <span>Password</span>';
          if (resetSubtitle) resetSubtitle.textContent = 'Create a secure new password for your Skyline account';
        } else {
          if (resetTitle) resetTitle.innerHTML = 'Новый <span>пароль</span>';
          if (resetSubtitle) resetSubtitle.textContent = 'Придумайте надежный новый пароль для вашего аккаунта Skyline';
        }
      }

      if (sb) {
        sb.auth.onAuthStateChange((event, session) => {
          if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && window.location.search.includes('code='))) {
            switchToUpdateMode();
          }
        });
      }

      const hash = window.location.hash || '';
      const urlParams = new URLSearchParams(window.location.search);
      const authCode = urlParams.get('code');

      if (authCode && sb) {
        switchToUpdateMode();
        sb.auth.exchangeCodeForSession(authCode).then(({ data, error }) => {
          if (error) {
            sb.auth.getSession().then(({ data: sessData }) => {
              if (sessData && sessData.session) {
                switchToUpdateMode();
              } else {
                const isEn = (localStorage.getItem('skyline_lang') || 'ru') === 'en';
                showAlert(isEn ? 'Recovery link has expired or is invalid. Please request a new one.' : 'Ссылка сброса пароля устарела или недействительна. Запросите новую ссылку.', 'error');
              }
            });
          } else {
            switchToUpdateMode();
          }
        }).catch(() => {});
      } else if (hash.includes('type=recovery') || hash.includes('access_token')) {
        switchToUpdateMode();
      }

      if (formRequest) {
        formRequest.addEventListener('submit', async (e) => {
          e.preventDefault();
          clearAlert();

          const emailInput = document.getElementById('requestEmail');
          const email = emailInput ? emailInput.value.trim() : '';

          if (!email || !email.includes('@') || !email.includes('.')) {
            const isEn = (localStorage.getItem('skyline_lang') || 'ru') === 'en';
            showAlert(isEn ? 'Please enter a valid email address.' : 'Введите корректный адрес электронной почты.');
            return;
          }

          if (btnSubmitRequest) {
            btnSubmitRequest.disabled = true;
            btnSubmitRequest.innerHTML = `<span class="btn-loader"></span> <span>${(localStorage.getItem('skyline_lang') || 'ru') === 'en' ? 'Sending...' : 'Отправка...'}</span>`;
          }

          if (sb) {
            try {
              let redirectUrl = window.location.origin + window.location.pathname;
              if (redirectUrl.startsWith('http://aquagrief.space')) {
                redirectUrl = redirectUrl.replace('http://', 'https://');
              }
              const { error } = await sb.auth.resetPasswordForEmail(email, {
                redirectTo: redirectUrl
              });

              if (error) {
                showAlert(error.message || 'Ошибка отправки запроса.', 'error');
              } else {
                const isEn = (localStorage.getItem('skyline_lang') || 'ru') === 'en';
                const successMsg = isEn 
                  ? 'Password reset link has been sent to your email! Please check your inbox (and spam folder).'
                  : 'Ссылка для сброса пароля успешно отправлена на ваш Email! Проверьте входящие сообщения (и папку Спам).';
                showAlert(successMsg, 'success');
                if (emailInput) emailInput.value = '';
              }
            } catch (err) {
              showAlert('Ошибка соединения с сервером.', 'error');
            }
          }

          if (btnSubmitRequest) {
            btnSubmitRequest.disabled = false;
            btnSubmitRequest.innerHTML = `<i class="bi bi-send-fill"></i> <span>${(localStorage.getItem('skyline_lang') || 'ru') === 'en' ? 'Send Reset Link' : 'Отправить ссылку для сброса'}</span>`;
          }
        });
      }

      if (formUpdate) {
        formUpdate.addEventListener('submit', async (e) => {
          e.preventDefault();
          clearAlert();

          const newPass = document.getElementById('newPassword').value;
          const confirmPass = document.getElementById('confirmNewPassword').value;
          const isEn = (localStorage.getItem('skyline_lang') || 'ru') === 'en';

          if (newPass.length < 6) {
            showAlert(isEn ? 'Password must be at least 6 characters.' : 'Пароль должен содержать минимум 6 символов.');
            return;
          }

          if (newPass !== confirmPass) {
            showAlert(isEn ? 'Passwords do not match!' : 'Введенные пароли не совпадают!');
            return;
          }

          if (btnSubmitUpdate) {
            btnSubmitUpdate.disabled = true;
            btnSubmitUpdate.innerHTML = `<span class="btn-loader"></span> <span>${isEn ? 'Saving...' : 'Сохранение...'}</span>`;
          }

          if (sb) {
            try {
              const { error } = await sb.auth.updateUser({
                password: newPass
              });

              if (error) {
                showAlert(error.message || 'Ошибка обновления пароля.', 'error');
              } else {
                const successMsg = isEn 
                  ? 'Password updated successfully! Redirecting to profile in 2 seconds...'
                  : 'Пароль успешно изменен! Выполняется перенаправление в личный кабинет...';
                showAlert(successMsg, 'success');
                setTimeout(() => {
                  window.location.href = 'profile.html';
                }, 2000);
                return;
              }
            } catch (err) {
              showAlert('Ошибка соединения с сервером.', 'error');
            }
          }

          if (btnSubmitUpdate) {
            btnSubmitUpdate.disabled = false;
            btnSubmitUpdate.innerHTML = `<i class="bi bi-check2-circle"></i> <span>${isEn ? 'Save New Password' : 'Сохранить новый пароль'}</span>`;
          }
        });
      }
    })();
  </script>

  <!-- Anime.js & Page Animations -->
  <script src="assets/anime.min.js"></script>
  <script src="animations.js"></script>
</body>
</html>
